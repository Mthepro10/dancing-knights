data:text/html,<!DOCTYPE html><body style="margin:0;background:black;overflow:hidden;touch-action:none"><canvas id=c></canvas><script>const x=c.getContext('2d');let W,H,a,R=[];const N=8,F=[150,200,300,400,500,600,700,800],C=['red','orange','gold','lime','cyan','dodgerblue','violet','hotpink'],K='asdfghjk';function z(){W=c.width=innerWidth;H=c.height=innerHeight}z();onresize=z;function p(i){a=a||new AudioContext;a.resume();let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=F[i];g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.8);R.push({x:(i+.5)*W/N,y:H/2+(Math.random()-.5)*H/3,r:10,l:1,c:C[i]})}onkeydown=e=>{let i=K.indexOf(e.key);if(i>=0&&!e.repeat)p(i)};onpointerdown=e=>p(Math.min(N-1,Math.floor(e.clientX/W*N)));(function f(){requestAnimationFrame(f);x.globalAlpha=1;x.shadowBlur=0;x.fillStyle='rgba(0,0,0,.15)';x.fillRect(0,0,W,H);x.shadowBlur=30;x.lineWidth=6;for(const q of R){x.strokeStyle=x.shadowColor=q.c;x.globalAlpha=q.l;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.stroke();q.r+=4;q.l-=.015}R=R.filter(q=>q.l>0);x.globalAlpha=1;x.shadowBlur=0;x.fillStyle='white';x.font='16px monospace';x.textAlign='center';x.fillText('press a s d f g h j k or touch screen',W/2,H-20)})();</script>
